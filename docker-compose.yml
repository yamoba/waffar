version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waffar
      POSTGRES_USER: waffar
      POSTGRES_PASSWORD: waffar_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waffar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: waffar_minio
      MINIO_ROOT_PASSWORD: waffar_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://waffar:waffar_secret@postgres:5432/waffar
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:5000
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: waffar_minio
      S3_SECRET_KEY: waffar_minio_secret
      S3_BUCKET: waffar-images
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret-change-in-production
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      - backend

  scrapers:
    build:
      context: ./scrapers
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://waffar:waffar_secret@postgres:5432/waffar
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:5000
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: waffar_minio
      S3_SECRET_KEY: waffar_minio_secret
      SCRAPER_CONCURRENCY: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scraper-beat:
    build:
      context: ./scrapers
      dockerfile: Dockerfile
    command: celery -A src.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://waffar:waffar_secret@postgres:5432/waffar
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://waffar:waffar_secret@postgres:5432/waffar
    volumes:
      - ai_models:/app/models

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infra/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ai_models:
  prometheus_data:
  grafana_data:
